name: Daily Update

on:
  schedule:
    # 每日 07:30 UTC（北京时间 15:30），站点同步脚本 06:20 UTC 之后
    - cron: '30 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # secrets 不能在 if: 里直接引用；按 GitHub 官方建议先落到 job 级 env，
    # 再由步骤用 env.HF_TOKEN 判断是否跳过。未配置时这一整步不执行。
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO || 'AmigaMeow/llm-leaderboard' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch snapshot from 17nas.com
        id: fetch
        run: |
          python3 scripts/generate.py \
            --api "${API_URL:-https://17nas.com/api/public/llm-leaderboard.php}" \
            --out . --limit 50
        env:
          API_URL: https://17nas.com/api/public/llm-leaderboard.php

      - name: Render README
        run: python3 scripts/render_readme.py --data data/latest.json --out .

      - name: Render charts (SVG)
        run: python3 scripts/render_charts.py --data data/latest.json --out .

      - name: Update CHANGELOG
        run: python3 scripts/changelog.py --data data/latest.json --out .

      - name: Commit and push
        run: |
          git config user.name  'AmigaMeow'
          git config user.email '240840432+AmigaMeow@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes today.'
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: daily snapshot ${DATE}"
          git push

      # 发布到 Hugging Face Datasets。未配置 HF_TOKEN 时自动跳过 —— 日常路径零新依赖。
      - name: Publish to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/publish_hf.py --repo "${HF_DATASET_REPO}"